<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Offline</title>
<meta name="theme-color" content="#0f1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="English">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--bg:#0f1420;--card:#1a2233;--card2:#222c41;--line:#2e3a54;--txt:#eef2f8;--mut:#9aa7bd;--acc:#f5b942;--ok:#3ecf8e;--bad:#ff6b6b;--day:#38bdf8;--biz:#b794f6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overscroll-behavior-y:none}
#app{max-width:640px;margin:0 auto;padding:12px 16px 40px;min-height:100%}
h1{font-size:22px;margin:0}h2{font-size:18px;margin:18px 0 8px}h3{font-size:15px;margin:14px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
p{margin:8px 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 12px}
.save{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mut);display:inline-block}
.dot.ok{background:var(--ok)}.dot.busy{background:var(--acc)}.dot.err{background:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.wrap{flex-wrap:wrap}
.big{font-size:30px;font-weight:700;line-height:1.1}.mut{color:var(--mut)}.sm{font-size:14px}.xs{font-size:12px}
.center{text-align:center}
button{font:inherit;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;width:100%;cursor:pointer;font-weight:600;min-height:52px}
button:active{transform:scale(.985);opacity:.9}
button.pri{background:var(--acc);color:#1a1300;border-color:var(--acc)}
button.good{background:var(--ok);color:#03251a;border-color:var(--ok)}
button.ghost{background:transparent}
button.link{background:none;border:none;color:var(--mut);font-weight:500;text-decoration:underline;min-height:40px;padding:8px;width:auto}
button.flight{background:linear-gradient(135deg,#2a6df4,#38bdf8);border:none;color:#fff;font-size:19px;padding:20px;min-height:72px}
button:disabled{opacity:.45}
.stack>*+*{margin-top:10px}
.bar{height:10px;background:var(--card2);border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .3s}
.bar.ok>i{background:var(--ok)}.bar.bad>i{background:var(--bad)}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.04em;text-transform:uppercase}
.chip.d{background:rgba(56,189,248,.16);color:var(--day)}.chip.b{background:rgba(183,148,246,.18);color:var(--biz)}
.chip.t{background:var(--card2);color:var(--mut)}
.q{font-size:20px;line-height:1.45;margin:12px 0}
.q .gap{display:inline-block;min-width:64px;border-bottom:2px solid var(--acc);color:var(--acc);text-align:center;font-weight:700}
.q .who{color:var(--mut);font-weight:700;margin-right:6px}
.q .line{margin:6px 0}
.pl{color:var(--mut);font-size:16px;margin:6px 0}
.pl.main{color:var(--txt);font-size:20px}
.req{display:inline-block;background:rgba(245,185,66,.14);color:var(--acc);border-radius:8px;padding:4px 10px;font-weight:700;margin-top:4px}
.wrong{background:rgba(255,107,107,.1);border:1px dashed rgba(255,107,107,.5);border-radius:12px;padding:10px 12px}
textarea,input[type=text]{width:100%;font:inherit;font-size:19px;color:var(--txt);background:#0b0f18;border:2px solid var(--line);border-radius:14px;padding:13px 14px;resize:none;outline:none}
textarea:focus{border-color:var(--acc)}
.words{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.words button{width:auto;min-height:42px;padding:8px 13px;border-radius:10px;font-weight:600}
.words button.used{opacity:.3}
.fb{border-radius:14px;padding:12px 14px;margin:12px 0}
.fb.ok{background:rgba(62,207,142,.12);border:1px solid rgba(62,207,142,.45)}
.fb.bad{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.45)}
.fb.hint{background:rgba(245,185,66,.1);border:1px solid rgba(245,185,66,.45)}
.fb b.h{display:block;margin-bottom:4px}
.model{font-size:19px;font-weight:700;margin:6px 0}
.banner{border-radius:14px;padding:12px 14px;margin:12px 0;background:rgba(245,185,66,.12);border:1px solid rgba(245,185,66,.45);font-size:15px}
.banner.info{background:rgba(56,189,248,.1);border-color:rgba(56,189,248,.4)}
.banner.err{background:rgba(255,107,107,.1);border-color:rgba(255,107,107,.45)}.banner.xs{font-size:13px;padding:9px 12px}.banner.sm{font-size:14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}.kv:last-child{border:none}
.kv b{white-space:nowrap}
.days{display:flex;align-items:flex-end;gap:4px;height:70px;margin-top:8px}.days i{flex:1;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px;opacity:.9}
.days i.z{background:var(--card2)}
.stat{margin:9px 0}.stat .l{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
pre.out{white-space:pre-wrap;word-break:break-word;background:#0b0f18;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px;max-height:240px;overflow:auto;user-select:text;-webkit-user-select:text}
.hide{display:none!important}
.sticky{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 26%);padding:18px 0 6px;margin-top:6px}
a{color:var(--day)}
.modal{position:fixed;inset:0;background:rgba(5,8,14,.8);display:flex;align-items:flex-end;justify-content:center;z-index:9;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.modal>.card{max-width:640px;width:100%;max-height:88vh;overflow:auto;margin:0}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0}.check span:first-child{width:22px;text-align:center}
</style>
</head>
<body>
<div id="app"><p class="mut">Ładowanie…</p></div>
<noscript>Ta aplikacja wymaga włączonego JavaScriptu.</noscript>
<script src="checker.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
